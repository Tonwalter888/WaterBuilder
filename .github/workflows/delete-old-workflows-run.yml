name: Delete old workflows run
on:
  workflow_dispatch:
          
jobs:
  build:
    name: Delete old workflows run
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflows run
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}